<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>शुभ विवाह – जीतू संग सपना</title>
<style>
:root{--bg:#3b0d1a;--bg2:#6b1d2f;--gold:#e8c26a;--paper:#f3ead6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg));color:var(--gold);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none}
h1{font-size:17px;margin:10px 0 2px;text-align:center;font-weight:600}
.sub{font-size:12px;opacity:.8;margin-bottom:6px}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;perspective:1800px;padding:0 10px}
.book{position:relative;height:100%;max-height:calc(100vw*1.7);aspect-ratio:9/16;max-width:100%;touch-action:pan-y}
.page{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.6,.05,.3,1),visibility 0s;border-radius:3px 8px 8px 3px;box-shadow:0 8px 30px rgba(0,0,0,.55)}
.page.f{transform:rotateY(-180deg);visibility:hidden;transition:transform 1s cubic-bezier(.6,.05,.3,1),visibility 0s 1s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:inherit;overflow:hidden}
.face img{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 6%)}
.back{transform:rotateY(180deg);background:linear-gradient(90deg,#d9cdb0,var(--paper))}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 10px 12px;flex-wrap:wrap}
button,a.btn{background:rgba(255,255,255,.1);color:var(--gold);border:1px solid var(--gold);border-radius:22px;padding:10px 16px;font-size:15px;text-decoration:none;font-family:inherit}
button:active{background:rgba(255,255,255,.25)}
.wa{background:#25D366;color:#fff;border-color:#25D366;font-weight:600}
#ind{min-width:44px;text-align:center;font-size:14px}
#toast{position:fixed;bottom:80px;background:#000a;color:#fff;padding:8px 14px;border-radius:16px;font-size:13px;opacity:0;transition:.3s}
</style></head><body>

var book=document.getElementById('book'),n=IMGS.length,cur=0,pages=[];
IMGS.forEach(function(s,i){var p=document.createElement('div');p.className='page';
p.innerHTML='<div class="face front"><img src="'+s+'" alt="page '+(i+1)+'"></div><div class="face back"></div>';
book.appendChild(p);pages.push(p)});
function render(){pages.forEach(function(p,i){var f=i<cur;p.classList.toggle('f',f);p.style.zIndex=f?i:n-i});
document.getElementById('ind').textContent=(cur+1)+' / '+n}
function next(){if(cur<n-1){cur++;render()}}function prev(){if(cur>0){cur--;render()}}
document.getElementById('nx').onclick=next;document.getElementById('pv').onclick=prev;
var sx=null,moved=false;
book.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;moved=false},{passive:true});
book.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;
if(dx<-40){next();moved=true}else if(dx>40){prev();moved=true}sx=null});
book.addEventListener('click',function(e){if(moved){moved=false;return}var r=book.getBoundingClientRect();(e.clientX-r.left<r.width*.3)?prev():next()});
function url(){try{return window.top.location.href}catch(x){return location.href}}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;setTimeout(function(){e.style.opacity=0},1800)}
document.getElementById('wa').onclick=function(){
var m='🙏 शुभ विवाह 🙏\nजीतू कुमार श्रीवास्तव संग सपना श्रीवास्तव\nशुक्रवार, 20 नवम्बर 2026\nआप सादर आमंत्रित हैं। डिजिटल निमंत्रण पत्र देखें:\n'+url();
window.open('https://wa.me/?text='+encodeURIComponent(m),'_blank')};
document.getElementById('cp').onclick=function(){var u=url();
try{navigator.clipboard.writeText(u).then(function(){toast('लिंक कॉपी हो गया')},function(){prompt('लिंक कॉपी करें',u)})}catch(x){prompt('लिंक कॉपी करें',u)}};
render();
</script></body></html>
